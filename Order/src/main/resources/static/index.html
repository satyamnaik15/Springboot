<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* ── Auth Card ── */
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      width: 360px;
      padding: 36px 32px;
    }

    h2 {
      text-align: center;
      font-size: 22px;
      color: #1a1a2e;
      margin-bottom: 24px;
    }

    .tabs {
      display: flex;
      border-bottom: 2px solid #e8e8e8;
      margin-bottom: 28px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      cursor: pointer;
      font-size: 15px;
      color: #888;
      font-weight: 500;
      transition: color 0.2s;
    }

    .tab.active {
      color: #4f46e5;
      border-bottom: 2px solid #4f46e5;
      margin-bottom: -2px;
    }

    .form { display: none; flex-direction: column; gap: 16px; }
    .form.active { display: flex; }

    label {
      font-size: 13px;
      color: #555;
      margin-bottom: 4px;
      display: block;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: #4f46e5; }

    button {
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }

    button:hover { background: #4338ca; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }

    .msg {
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }

    .msg.success { background: #ecfdf5; color: #065f46; display: block; }
    .msg.error   { background: #fef2f2; color: #991b1b; display: block; }

    /* ── Home Page ── */
    #home-page {
      display: none;
      width: 100%;
      min-height: 100vh;
      flex-direction: column;
      background: #f0f2f5;
    }

    #home-page.visible { display: flex; }

    .navbar {
      background: #fff;
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    .navbar .brand {
      font-size: 18px;
      font-weight: 700;
      color: #4f46e5;
    }

    .navbar .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .navbar .username-badge {
      background: #ede9fe;
      color: #4f46e5;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
    }

    .logout-btn {
      width: auto;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      background: #ef4444;
      border-radius: 8px;
      margin-top: 0;
    }

    .logout-btn:hover { background: #dc2626; }

    .home-content {
      flex: 1;
      padding: 40px 32px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .welcome-banner {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 14px;
      padding: 32px 36px;
      color: #fff;
      margin-bottom: 32px;
    }

    .welcome-banner h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .welcome-banner p {
      font-size: 14px;
      opacity: 0.85;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 24px 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-card .icon {
      font-size: 28px;
    }

    .stat-card .label {
      font-size: 13px;
      color: #888;
      font-weight: 500;
    }

    .stat-card .value {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 14px;
    }

    .info-card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 14px;
    }

    .info-row:last-child { border-bottom: none; }

    .info-row .info-key { color: #888; font-weight: 500; }
    .info-row .info-val { color: #1a1a2e; font-weight: 600; word-break: break-all; max-width: 60%; text-align: right; }

    .token-preview {
      font-size: 11px;
      color: #6d6d6d;
      background: #f8f8ff;
      border: 1px solid #e0e0ff;
      border-radius: 6px;
      padding: 8px 12px;
      word-break: break-all;
      margin-top: 12px;
    }

    .token-toggle {
      font-size: 12px;
      color: #4f46e5;
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      width: auto;
      padding: 0;
      margin: 8px 0 0 0;
      font-weight: 500;
    }

    .token-toggle:hover { background: none; color: #4338ca; }
  </style>
</head>
<body>

  <!-- ── Auth Page ── -->
  <div id="auth-page">
    <div class="card">
      <h2>Welcome</h2>

      <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">Login</div>
        <div class="tab" onclick="switchTab('register')">Register</div>
      </div>

      <!-- Login Form -->
      <div id="login-form" class="form active">
        <div>
          <label>Username</label>
          <input type="text" id="login-username" placeholder="Enter username" />
        </div>
        <div>
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter password" />
        </div>
        <div id="login-msg" class="msg"></div>
        <button onclick="login()">Login</button>
      </div>

      <!-- Register Form -->
      <div id="register-form" class="form">
        <div>
          <label>Username</label>
          <input type="text" id="reg-username" placeholder="Choose a username" />
        </div>
        <div>
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="Choose a password" />
        </div>
        <div id="register-msg" class="msg"></div>
        <button onclick="register()">Register</button>
      </div>
    </div>
  </div>

  <!-- ── Home Page ── -->
  <div id="home-page">
    <nav class="navbar">
      <div class="brand">MyApp</div>
      <div class="nav-right">
        <div class="username-badge" id="nav-username"></div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </nav>

    <div class="home-content">
      <div class="welcome-banner">
        <h1 id="welcome-heading">Welcome back!</h1>
        <p>You are successfully logged in. Your session is active and secured with JWT.</p>
      </div>

      <div class="cards-grid">
        <div class="stat-card">
          <div class="icon">✅</div>
          <div class="label">Status</div>
          <div class="value" style="color:#16a34a;">Active</div>
        </div>
        <div class="stat-card">
          <div class="icon">🔐</div>
          <div class="label">Auth Type</div>
          <div class="value" style="font-size:15px;">JWT Bearer</div>
        </div>
        <div class="stat-card">
          <div class="icon">🕐</div>
          <div class="label">Logged in at</div>
          <div class="value" id="login-time" style="font-size:14px;">—</div>
        </div>
      </div>

      <div class="section-title">Session Info</div>
      <div class="info-card">
        <div class="info-row">
          <span class="info-key">Username</span>
          <span class="info-val" id="info-username">—</span>
        </div>
        <div class="info-row">
          <span class="info-key">Token Status</span>
          <span class="info-val" style="color:#16a34a;">Valid</span>
        </div>
        <div class="info-row" style="flex-direction:column; align-items:flex-start; gap:8px;">
          <span class="info-key">JWT Token</span>
          <div id="token-display" class="token-preview" style="display:none;"></div>
          <button class="token-toggle" onclick="toggleToken()">Show Token</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentToken = null;
    let tokenVisible = false;

    // Check if already logged in
    const saved = localStorage.getItem('jwt_token');
    const savedUser = localStorage.getItem('jwt_username');
    if (saved && savedUser) {
      currentToken = saved;
      showHome(savedUser);
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
      document.querySelector(`.tab:${tab === 'login' ? 'first-child' : 'last-child'}`).classList.add('active');
      document.getElementById(tab + '-form').classList.add('active');
    }

    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'msg ' + type;
    }

    function showHome(username) {
      document.getElementById('auth-page').style.display = 'none';
      document.body.style.alignItems = 'stretch';
      document.body.style.justifyContent = 'stretch';
      const home = document.getElementById('home-page');
      home.classList.add('visible');

      document.getElementById('nav-username').textContent = username;
      document.getElementById('welcome-heading').textContent = 'Welcome back, ' + username + '!';
      document.getElementById('info-username').textContent = username;
      document.getElementById('login-time').textContent = new Date().toLocaleTimeString();
    }

    function logout() {
      localStorage.removeItem('jwt_token');
      localStorage.removeItem('jwt_username');
      currentToken = null;
      tokenVisible = false;
      document.getElementById('home-page').classList.remove('visible');
      document.getElementById('auth-page').style.display = 'flex';
      document.body.style.alignItems = 'center';
      document.body.style.justifyContent = 'center';
      document.getElementById('login-username').value = '';
      document.getElementById('login-password').value = '';
      document.getElementById('token-display').style.display = 'none';
      document.querySelector('.token-toggle').textContent = 'Show Token';
    }

    function toggleToken() {
      const box = document.getElementById('token-display');
      const btn = document.querySelector('.token-toggle');
      if (!tokenVisible) {
        box.textContent = currentToken;
        box.style.display = 'block';
        btn.textContent = 'Hide Token';
        tokenVisible = true;
      } else {
        box.style.display = 'none';
        btn.textContent = 'Show Token';
        tokenVisible = false;
      }
    }

    async function login() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      if (!username || !password) { showMsg('login-msg', 'Please fill in all fields.', 'error'); return; }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const text = await res.text();
        let data = null;
        try { data = JSON.parse(text); } catch {}

        if (res.ok && data && data.token) {
          currentToken = data.token;
          localStorage.setItem('jwt_token', data.token);
          localStorage.setItem('jwt_username', username);
          showHome(username);
        } else {
          if (res.status === 401 || res.status === 403) {
            showMsg('login-msg', 'Invalid username or password.', 'error');
          } else {
            showMsg('login-msg', (data && data.message) || text || 'Login failed.', 'error');
          }
        }
      } catch {
        showMsg('login-msg', 'Could not connect to server.', 'error');
      }
    }

    async function register() {
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      if (!username || !password) { showMsg('register-msg', 'Please fill in all fields.', 'error'); return; }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const text = await res.text();
        if (res.ok) {
          showMsg('register-msg', 'Registered successfully! You can now login.', 'success');
          document.getElementById('reg-username').value = '';
          document.getElementById('reg-password').value = '';
        } else {
          showMsg('register-msg', text || 'Registration failed.', 'error');
        }
      } catch {
        showMsg('register-msg', 'Could not connect to server.', 'error');
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const activeForm = document.querySelector('.form.active');
        if (!activeForm) return;
        if (activeForm.id === 'login-form') login();
        else register();
      }
    });
  </script>
</body>
</html>
