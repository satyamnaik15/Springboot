<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TrashTalk AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #7c3aed;
      --primary-dark: #6d28d9;
      --primary-light: #ede9fe;
      --danger: #ef4444;
      --bg: #0f0f14;
      --surface: #1a1a24;
      --surface2: #242433;
      --border: #2e2e42;
      --text: #e8e8f0;
      --text-muted: #888899;
      --user-bubble: #7c3aed;
      --ai-bubble: #1e1e2e;
      --ai-border: #3a3a52;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
    }

    /* ── Auth ── */
    #auth-page { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 100vh; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      width: 380px;
      padding: 40px 36px;
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-icon { font-size: 36px; }
    .logo h1 { font-size: 22px; font-weight: 800; color: var(--text); margin-top: 8px; }
    .logo p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 600;
      transition: color 0.2s;
    }

    .tab.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
      margin-bottom: -1px;
    }

    .form { display: none; flex-direction: column; gap: 16px; }
    .form.active { display: flex; }

    .field label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px; }

    input {
      width: 100%;
      padding: 11px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--primary); }
    input::placeholder { color: var(--text-muted); }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 4px;
    }

    .btn:hover { background: var(--primary-dark); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #4a3a7a; cursor: not-allowed; }

    .msg {
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }

    .msg.success { background: #052e16; color: #4ade80; border: 1px solid #166534; display: block; }
    .msg.error   { background: #2d0a0a; color: #f87171; border: 1px solid #7f1d1d; display: block; }

    /* ── Chat App ── */
    #chat-app {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      background: var(--bg);
    }

    #chat-app.visible { display: flex; }

    .navbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }

    .nav-brand { display: flex; align-items: center; gap: 10px; }
    .nav-brand .brand-icon { font-size: 22px; }
    .nav-brand .brand-name { font-size: 17px; font-weight: 800; color: var(--text); }
    .nav-brand .brand-tag { font-size: 11px; color: var(--primary); font-weight: 600; background: var(--primary-light); color: var(--primary); padding: 2px 8px; border-radius: 20px; }

    .nav-right { display: flex; align-items: center; gap: 12px; }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--text);
      font-weight: 600;
    }

    .user-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }

    .logout-btn {
      width: auto;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 600;
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      margin: 0;
    }

    .logout-btn:hover { background: rgba(239,68,68,0.1); }

    /* Messages area */
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .chat-body::-webkit-scrollbar { width: 6px; }
    .chat-body::-webkit-scrollbar-track { background: transparent; }
    .chat-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      max-width: 720px;
      width: 100%;
    }

    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.ai   { align-self: flex-start; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
    }

    .msg-row.user .avatar { background: var(--primary); color: #fff; }
    .msg-row.ai   .avatar { background: var(--surface2); border: 1px solid var(--border); font-size: 16px; }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.55;
      max-width: calc(100% - 50px);
      word-break: break-word;
    }

    .msg-row.user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-row.ai .bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--ai-border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .bubble-time {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 5px;
      display: block;
      text-align: right;
    }

    .msg-row.ai .bubble-time { text-align: left; }

    /* Typing indicator */
    .typing-indicator {
      display: none;
      align-self: flex-start;
      align-items: flex-end;
      gap: 10px;
      max-width: 720px;
    }

    .typing-indicator.visible { display: flex; }

    .typing-bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--ai-border);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      padding: 14px 18px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
    }

    .empty-state .empty-icon { font-size: 52px; }
    .empty-state h3 { font-size: 18px; font-weight: 700; color: var(--text); }
    .empty-state p { font-size: 14px; max-width: 320px; line-height: 1.6; }

    /* Input bar */
    .chat-input-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .chat-input-wrap { flex: 1; }

    #chat-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      color: var(--text);
      resize: none;
      outline: none;
      min-height: 48px;
      max-height: 140px;
      line-height: 1.5;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    #chat-input:focus { border-color: var(--primary); }
    #chat-input::placeholder { color: var(--text-muted); }

    #send-btn {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      padding: 0;
      background: var(--primary);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
      margin: 0;
    }

    #send-btn:hover { background: var(--primary-dark); }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { background: #4a3a7a; cursor: not-allowed; }

    .hint { font-size: 11px; color: var(--text-muted); margin-top: 5px; padding-left: 4px; }
  </style>
</head>
<body>

  <!-- ── Auth Page ── -->
  <div id="auth-page">
    <div class="card">
      <div class="logo">
        <div class="logo-icon">🔥</div>
        <h1>TrashTalk AI</h1>
        <p>Where kindness goes to die</p>
      </div>

      <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">Login</div>
        <div class="tab" onclick="switchTab('register')">Register</div>
      </div>

      <div id="login-form" class="form active">
        <div class="field">
          <label>Username</label>
          <input type="text" id="login-username" placeholder="Enter username" autocomplete="username" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password" />
        </div>
        <div id="login-msg" class="msg"></div>
        <button class="btn" onclick="login()">Login</button>
      </div>

      <div id="register-form" class="form">
        <div class="field">
          <label>Username</label>
          <input type="text" id="reg-username" placeholder="Choose a username" autocomplete="username" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="Choose a password" autocomplete="new-password" />
        </div>
        <div id="register-msg" class="msg"></div>
        <button class="btn" onclick="register()">Create Account</button>
      </div>
    </div>
  </div>

  <!-- ── Chat App ── -->
  <div id="chat-app">
    <nav class="navbar">
      <div class="nav-brand">
        <span class="brand-icon">🔥</span>
        <span class="brand-name">TrashTalk AI</span>
        <span class="brand-tag">Powered by Ollama</span>
      </div>
      <div class="nav-right">
        <div class="user-pill">
          <div class="user-avatar" id="user-avatar-letter"></div>
          <span id="nav-username"></span>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </nav>

    <div class="chat-body" id="chat-body">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">💀</div>
        <h3>Say something. I dare you.</h3>
        <p>Type a message and prepare to get absolutely roasted by the most savage AI on the planet.</p>
      </div>
    </div>

    <div class="typing-indicator" id="typing-indicator">
      <div class="avatar" style="background:var(--surface2); border:1px solid var(--border);">🤖</div>
      <div class="typing-bubble">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="chat-input-bar">
      <div class="chat-input-wrap">
        <textarea id="chat-input" placeholder="Say something... if you dare 😏" rows="1"></textarea>
        <div class="hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</div>
      </div>
      <button id="send-btn" onclick="sendMessage()" title="Send">➤</button>
    </div>
  </div>

  <script>
    let jwtToken = null;
    let currentUser = null;
    let sending = false;

    // Decode JWT payload and check expiry
    function isTokenExpired(token) {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        return payload.exp * 1000 < Date.now();
      } catch {
        return true;
      }
    }

    // Auto-login if token saved and not expired
    const saved = localStorage.getItem('jwt_token');
    const savedUser = localStorage.getItem('jwt_username');
    if (saved && savedUser && !isTokenExpired(saved)) {
      jwtToken = saved;
      currentUser = savedUser;
      showChat();
    } else if (saved) {
      // Clear stale/expired token
      localStorage.removeItem('jwt_token');
      localStorage.removeItem('jwt_username');
    }

    // ── Auth ──
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
      document.querySelector(`.tab:${tab === 'login' ? 'first-child' : 'last-child'}`).classList.add('active');
      document.getElementById(tab + '-form').classList.add('active');
    }

    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'msg ' + type;
    }

    async function login() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      if (!username || !password) { showMsg('login-msg', 'Fill in all fields.', 'error'); return; }

      const btn = document.querySelector('#login-form .btn');
      btn.disabled = true;
      btn.textContent = 'Logging in…';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json().catch(() => null);

        if (res.ok && data?.token) {
          jwtToken = data.token;
          currentUser = username;
          localStorage.setItem('jwt_token', data.token);
          localStorage.setItem('jwt_username', username);
          showChat();
        } else {
          showMsg('login-msg', res.status === 401 ? 'Invalid credentials.' : (data?.message || 'Login failed.'), 'error');
        }
      } catch {
        showMsg('login-msg', 'Cannot connect to server.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    }

    async function register() {
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      if (!username || !password) { showMsg('register-msg', 'Fill in all fields.', 'error'); return; }

      const btn = document.querySelector('#register-form .btn');
      btn.disabled = true;
      btn.textContent = 'Creating account…';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const text = await res.text();
        if (res.ok) {
          showMsg('register-msg', 'Account created! Switch to Login.', 'success');
          document.getElementById('reg-username').value = '';
          document.getElementById('reg-password').value = '';
        } else {
          showMsg('register-msg', text || 'Registration failed.', 'error');
        }
      } catch {
        showMsg('register-msg', 'Cannot connect to server.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }

    function showChat() {
      document.getElementById('auth-page').style.display = 'none';
      document.body.style.alignItems = 'stretch';
      document.body.style.justifyContent = 'stretch';
      const app = document.getElementById('chat-app');
      app.classList.add('visible');

      document.getElementById('nav-username').textContent = currentUser;
      document.getElementById('user-avatar-letter').textContent = currentUser.charAt(0).toUpperCase();

      document.getElementById('chat-input').focus();
    }

    function logout() {
      localStorage.removeItem('jwt_token');
      localStorage.removeItem('jwt_username');
      jwtToken = null;
      currentUser = null;

      // Reset chat
      const body = document.getElementById('chat-body');
      body.innerHTML = `
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">💀</div>
          <h3>Say something. I dare you.</h3>
          <p>Type a message and prepare to get absolutely roasted by the most savage AI on the planet.</p>
        </div>`;

      document.getElementById('chat-app').classList.remove('visible');
      document.getElementById('auth-page').style.display = 'flex';
      document.body.style.alignItems = 'center';
      document.body.style.justifyContent = 'center';
      document.getElementById('login-username').value = '';
      document.getElementById('login-password').value = '';
    }

    // ── Chat ──
    function timeNow() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function appendMessage(text, role) {
      const empty = document.getElementById('empty-state');
      if (empty) empty.remove();

      const body = document.getElementById('chat-body');
      const isUser = role === 'user';

      const row = document.createElement('div');
      row.className = 'msg-row ' + role;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = isUser ? currentUser.charAt(0).toUpperCase() : '🤖';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      const txt = document.createElement('span');
      txt.textContent = text;

      const time = document.createElement('span');
      time.className = 'bubble-time';
      time.textContent = timeNow();

      bubble.appendChild(txt);
      bubble.appendChild(time);
      row.appendChild(avatar);
      row.appendChild(bubble);
      body.appendChild(row);

      body.scrollTop = body.scrollHeight;
      return row;
    }

    function setTyping(visible) {
      const el = document.getElementById('typing-indicator');
      el.classList.toggle('visible', visible);
      if (visible) {
        document.getElementById('chat-body').scrollTop = document.getElementById('chat-body').scrollHeight;
      }
    }

    async function sendMessage() {
      if (sending) return;

      const input = document.getElementById('chat-input');
      const message = input.value.trim();
      if (!message) return;

      // Check token expiry before sending
      if (!jwtToken || isTokenExpired(jwtToken)) {
        logout();
        return;
      }

      input.value = '';
      input.style.height = 'auto';
      sending = true;
      document.getElementById('send-btn').disabled = true;

      appendMessage(message, 'user');
      setTyping(true);

      try {
        const res = await fetch('/api/chat/message', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + jwtToken
          },
          body: JSON.stringify({ message })
        });

        setTyping(false);

        if (res.status === 401 || res.status === 403) {
          // Token rejected by server — force re-login
          logout();
          return;
        }

        if (!res.ok) {
          appendMessage('Server error (' + res.status + '). Try again.', 'ai');
          return;
        }

        const data = await res.json();
        if (data?.reply) {
          appendMessage(data.reply, 'ai');
        } else {
          appendMessage('Something went wrong. The AI is probably too embarrassed to reply.', 'ai');
        }
      } catch {
        setTyping(false);
        appendMessage('Cannot reach the server. Even the internet is avoiding you.', 'ai');
      } finally {
        sending = false;
        document.getElementById('send-btn').disabled = false;
        input.focus();
      }
    }

    // Auto-resize textarea
    document.getElementById('chat-input').addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 140) + 'px';
    });

    // Enter to send, Shift+Enter for newline
    document.getElementById('chat-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Auth page Enter key
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || document.getElementById('auth-page').style.display === 'none') return;
      const activeForm = document.querySelector('.form.active');
      if (!activeForm) return;
      if (activeForm.id === 'login-form') login();
      else register();
    });
  </script>
</body>
</html>
